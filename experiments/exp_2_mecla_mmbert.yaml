exp_name: exp_2_mecla_mmbert
model_id: jhu-clsp/mmBERT-base

baseline_exp: baseline_mmbert
load_best_params_from_hpsearch: true
best_params_paths: 
  training_args:
    - experiments/baseline_mmbert/hpsearch_eval_loss.jsonl
  trainer_args:
    - experiments/exp_2_mecla_mmbert/hpsearch_eval_loss.jsonl

early_stopping_patience: 3

dataset_args:
  task: token_classification
  dataset_path: datasets/breast_cancer_dataset
  annotation_scheme : "IO"
  max_length: 1024
  custom_label_mapping:
    {
      'HER2_OUTROS': 'HER2_POSITIVO', # map 'HER2_OUTROS' to 'HER2_POSITIVO'
    }
  split_ratio:
    train: 0.6
    val: 0.2
    test: 0.2

training_args:
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 10
  num_train_epochs: 10
  include_for_metrics: ['inputs']
  eval_strategy: "epoch"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  save_total_limit: 0

trainer_args:
  loss_type: "bce_with_pairwise_mecla"
  mutually_exclusive_classes: [
    ['HER2_POSITIVO', 'HER2_NEGATIVO'],
    ['RE_POSITIVO', 'RE_NEGATIVO'],
    ['RP_POSITIVO', 'RP_NEGATIVO'],
  ]

threshold_selection:
  min_recall: 0.1 
  min_precision: 0.1
  prioritize: "f1_score"

hyperparameter_search:
  0:
    n_trials: 20
    metrics: 
      - "eval_loss"
    directions: 
      - "minimize"
    load_if_exists: true
    parameters:
      mecla_amplification_factor:
        method: "suggest_float"
        args:
          name: "mecla_amplification_factor"
          low: 0.01
          high: 10.0
          log: true

resume_from_checkpoint: false