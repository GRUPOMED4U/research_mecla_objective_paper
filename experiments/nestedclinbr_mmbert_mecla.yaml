exp_name: nestedclinbr_mmbert_mecla
model_id: jhu-clsp/mmBERT-base

load_best_params_from_hpsearch: true
best_params_paths: 
  training_args:
    - experiments/nestedclinbr_mmbert_baseline/hpsearch_eval_loss.jsonl
  trainer_args:
    - experiments/nestedclinbr_mmbert_mecla/hpsearch_eval_loss.jsonl
early_stopping_patience: 20

dataset_args:
  task: token_classification
  dataset_path: 
    train: datasets/nested_clin_dataset/train
    test: datasets/nested_clin_dataset/test
  file_format: brat
  annotation_scheme : "IO"
  max_length: 1024

training_args:
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 10
  num_train_epochs: 100
  include_for_metrics: ['inputs']
  eval_strategy: "epoch"
  logging_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  save_total_limit: 0
  learning_rate: 0.00001
  weight_decay: 0.0

trainer_args:
  loss_type: "bce_with_mecla"
  mutually_exclusive_classes: [
    ['Teste', 'Tratamento'],
  ]

threshold_selection:
  min_recall: 0.1 
  min_precision: 0.1
  prioritize: "f1_score"

hyperparameter_search:
  0:
    n_trials: 20
    metrics: 
      - "eval_loss"
    directions: 
      - "minimize"
    load_if_exists: true
    parameters:
      mecla_amplification_factor:
        method: "suggest_float"
        args:
          name: "mecla_amplification_factor"
          low: 0.01
          high: 10.0
          log: true

resume_from_checkpoint: false