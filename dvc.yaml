vars:
  # List of random seeds for data split
  - random_seed: [387, 3, 510, 892, 658, 284, 669, 295, 552, 561, 568, 703, 200, 201, 586, 460, 77, 462, 209, 855, 730, 475, 476, 740, 741, 105, 754, 891, 508, 126] 
  - global_options: ""
  - models:
      - mmbert

stages:
  baseline_hpsearch:
    matrix:
      experiment: ${models}
      random_seed: ${random_seed}
    cmd: python hpsearch.py --config experiments/baseline_${item.experiment}.yaml --set dataset_args.random_seed=${item.random_seed} ${global_options}
    deps:
      - datasets/breast_cancer_dataset
      - hpsearch.py
    outs:
      - experiments/baseline_${item.experiment}/hpsearch_eval_loss_data_split_seed_${item.random_seed}.jsonl

  baseline:
    matrix:
      experiment: ${models}
      random_seed: ${random_seed}
    cmd: python train.py --config experiments/baseline_${item.experiment}.yaml --set dataset_args.random_seed=${item.random_seed} ${global_options}
    deps:
      - experiments/baseline_${item.experiment}/hpsearch_eval_loss_data_split_seed_${item.random_seed}.jsonl
      - datasets/breast_cancer_dataset
    outs:
      - experiments/baseline_${item.experiment}/metrics_data_split_seed_${item.random_seed}.jsonl

  bce_with_mecla:
    matrix:
      random_seed: ${random_seed}
      config_path: [experiments/bce_with_mecla.yaml]
    cmd: python hpsearch.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed}  ${global_options} && python train.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed} ${global_options}
    outs:
      - experiments/bce_with_mecla/metrics_data_split_seed_${item.random_seed}.jsonl
      - experiments/bce_with_mecla/hpsearch_eval_loss_data_split_seed_${item.random_seed}.jsonl

  bce_with_pairwise_mecla:
    matrix:
      random_seed: ${random_seed}
      config_path: [experiments/bce_with_pairwise_mecla.yaml]
    cmd: python hpsearch.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed}  ${global_options} && python train.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed} ${global_options}
    outs:
      - experiments/bce_with_pairwise_mecla/metrics_data_split_seed_${item.random_seed}.jsonl
      - experiments/bce_with_pairwise_mecla/hpsearch_eval_loss_data_split_seed_${item.random_seed}.jsonl

  bce_with_grouped_softmax:
    matrix:
      random_seed: ${random_seed}
      config_path: [experiments/bce_with_grouped_softmax.yaml]
    cmd: python train.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed} ${global_options}
    outs:
      - experiments/bce_with_grouped_softmax/metrics_data_split_seed_${item.random_seed}.jsonl

  bce_with_grouped_softmax_as_penalty:
    matrix:
      random_seed: ${random_seed}
      config_path: [experiments/bce_with_grouped_softmax_as_penalty.yaml]
    cmd: python hpsearch.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed}  ${global_options} && python train.py --config ${item.config_path} --set dataset_args.random_seed=${item.random_seed} ${global_options}
    outs:
      - experiments/bce_with_grouped_softmax_as_penalty/metrics_data_split_seed_${item.random_seed}.jsonl
      - experiments/bce_with_grouped_softmax_as_penalty/hpsearch_eval_loss_data_split_seed_${item.random_seed}.jsonl