[project]
name = "research_mecla_objective_paper"
version = "0.1.0"
description = "Biblioteca para treino, avaliação e distribuição de modelos de NER da Spesia."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Núcleo científico e ML
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "transformers==4.57.1",
    "accelerate>=1.10.1",
    "dotenv>=0.9.9",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "jsonlines>=4.0.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pydantic>=2.12.2",
    "pyyaml>=6.0.3",
    "pytest>=8.4.2",
    "scikit-learn>=1.7.2",
    "scikit-multilearn>=0.2.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "optuna>=4.6.0",
    "pytest-mock>=3.15.1",
    "peft>=0.18.0",
    "dvc[gs]>=3.64.2",
    "datasets>=4.4.2",
    "optuna-dashboard>=0.20.0",
    "trl>=0.26.2",
    "nltk>=3.9.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "mkdocstrings-python>=2.0.1",
    "cliffs-delta>=1.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[project.urls]
"Homepage" = "https://github.com/GRUPOMED4U/research_ner_leaderboard"

[tool.setuptools]
# You can add setuptools specific configurations here
# e.g., enabling automatic package discovery
packages = ["spesia_research"]
